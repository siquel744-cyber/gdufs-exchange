<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GDUFS交换站 | 二手交易平台</title>
  <link rel="shortcut icon" href="/static/favicon.ico" />
  <link rel="icon" type="image/jpeg" href="/static/logo.jpg" />
  <style>
:root {
  color-scheme: light;
  font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  --bg: #F9EFEF; /* 页面主背景：极浅柔雾粉 */
  --surface: #FFFBF5; /* 卡片/模块背景：奶油米黄 */
  --surface-soft: #FFFBF5;
  --text-primary: #4A2C2A; /* 主要文字：暖深棕 */
  --text-secondary: #7A5C55; /* 辅助文字：中棕 */
  --accent: #F0A5A0; /* 主色调：蜜桃粉 */
  --accent-strong: #4A2C2A; /* 强调/悬停色：深棕 */
  --border: #E5D9D8; /* 边框、分割线 */
  --sold: #B5A5A2; /* 已售出标识 */
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.05);
  --radius: 28px;
}
* {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  min-height: 100%;
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%);
}
body {
  color: var(--text-primary);
}
img {
  display: block;
  max-width: 100%;
}
button, input, select, textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
.hidden {
  display: none !important;
}
.page-shell {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
  padding: 24px 0 48px;
}
.app-header {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: center;
  padding: 22px 28px;
  margin-bottom: 28px;
  border: 1px solid var(--border);
  background: var(--surface);
  backdrop-filter: blur(16px);
  border-radius: 32px;
  box-shadow: var(--shadow);
}
.brand {
  display: flex;
  align-items: center;
  gap: 16px;
}
.brand-mark {
  width: 52px;
  height: 52px;
  border-radius: 18px;
  object-fit: cover;
  display: block;
}
.brand h1 {
  margin: 0;
  font-size: 1.4rem;
}
.brand p {
  margin: 4px 0 0;
  color: var(--text-secondary);
  font-size: 0.95rem;
}
.app-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.user-panel {
  display: flex;
  align-items: center;
  gap: 10px;
}
.user-welcome {
  color: var(--text-secondary);
  font-size: 0.95rem;
}
.primary-button,
.secondary-button {
  border: none;
  border-radius: 18px;
  padding: 14px 20px;
  font-weight: 700;
}
.small {
  padding: 10px 14px;
  font-size: 0.95rem;
}
.primary-button {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 8px 20px rgba(240,165,160,0.12);
  transition: background-color 0.25s ease;
}
.primary-button:hover {
  background: var(--accent-strong);
}
.secondary-button {
  background: #fff;
  color: var(--text-primary);
  border: 1px solid var(--border);
  transition: all 0.25s ease;
}
.secondary-button:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.hero-panel {
  display: flex;
  gap: 20px;
  align-items: flex-end;
  padding: 32px 28px;
  margin-bottom: 24px;
  background: #fff;
  border-radius: 32px;
  box-shadow: var(--shadow);
}
.hero-copy {
  flex: 1.3;
}
.eyebrow {
  margin: 0 0 10px;
  font-size: 0.95rem;
  letter-spacing: 0.14em;
  color: var(--accent-strong);
  text-transform: uppercase;
}
.hero-copy h2 {
  margin: 0;
  font-size: clamp(2rem, 3vw, 2.8rem);
  line-height: 1.05;
}
.hero-text {
  margin: 16px 0 0;
  color: var(--text-secondary);
  max-width: 560px;
  line-height: 1.75;
}
.search-panel {
  min-width: 320px;
}
.search-label {
  display: block;
  margin-bottom: 12px;
  font-weight: 700;
  color: var(--text-secondary);
}
.search-box {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  background: #F9F8F5;
  border: 1px solid var(--border);
  padding: 12px;
  border-radius: 24px;
}
.search-box input {
  border: none;
  background: transparent;
  outline: none;
  color: var(--text-primary);
  font-size: 1rem;
}
.search-box input::placeholder {
  color: #C4B8B6;
}
.search-box button {
  min-width: 96px;
}
.product-summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin: 24px 0 12px;
}
.summary-label {
  margin: 0 0 8px;
  color: var(--accent-strong);
  font-weight: 700;
}
.product-summary h3,
.product-summary p {
  margin: 0;
}
.product-summary p {
  color: var(--text-secondary);
}
.product-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 22px;
}
.product-card {
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: var(--surface);
  border-radius: 28px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  position: relative;
}
.product-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 26px 60px rgba(0, 0, 0, 0.08);
}
.sold-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 6px 10px;
  border-radius: 999px;
  background: #E53E3E; /* 红色明显已售出 */
  color: #FFFFFF;
  font-weight: 800;
  font-size: 0.9rem;
  letter-spacing: 0.02em;
  display: block;
  z-index: 30;
}

.image-wrap {
  position: relative;
  width: 100%;
}

.sold-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.45);
  color: #fff;
  font-weight: 800;
  font-size: 1.05rem;
  pointer-events: none; /* 仅视觉效果，不阻止点击 */
  z-index: 20;
}
.card-actions {
  display: flex;
  justify-content: flex-end;
}
.product-card img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
}
.card-body {
  padding: 18px;
  display: grid;
  gap: 14px;
}
.card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.price-tag {
  background: rgba(240,165,160,0.12);
  color: var(--accent);
  padding: 8px 12px;
  border-radius: 16px;
  font-weight: 800;
}
.card-title {
  margin: 0;
  font-size: 1.1rem;
  line-height: 1.4;
}
.card-category {
  color: var(--text-secondary);
  font-size: 0.95rem;
}
.card-desc {
  color: var(--text-secondary);
  font-size: 0.96rem;
  min-height: 3rem;
}
.seller-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}
.seller-info span {
  font-size: 0.95rem;
  color: var(--text-secondary);
}
.contact-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(240,165,160,0.10);
  color: var(--accent);
  font-size: 0.95rem;
}
.tip-card {
  margin-top: 32px;
  padding: 24px 28px;
  border-radius: 28px;
  background: #FEFCF9;
  border: 1px solid var(--border);
}
.tip-card h3 {
  margin: 0 0 16px;
}
.tip-list {
  display: grid;
  gap: 12px;
}
.tip-list span {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-radius: 20px;
  background: #fff;
  color: var(--text-secondary);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.28);
  display: grid;
  place-items: center;
  padding: 20px;
  z-index: 50;
}
.modal-backdrop.hidden {
  display: none;
}
.modal-card {
  width: min(640px, 100%);
  background: #fff;
  border-radius: 32px;
  max-height: 90vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  box-shadow: 0 36px 80px rgba(16, 12, 36, 0.18);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  padding: 28px 28px 22px 28px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 10;
  flex-shrink: 0;
  margin-bottom: 0;
}
.modal-header h2 {
  margin: 0;
  font-size: 1.5rem;
}
.modal-header p {
  margin: 8px 0 0;
  color: var(--text-secondary);
}
.icon-button {
  border: none;
  background: rgba(240,165,160,0.08);
  color: var(--accent);
  width: 42px;
  height: 42px;
  border-radius: 14px;
  font-size: 1.8rem;
  line-height: 0;
  cursor: pointer;
  transition: all 0.25s ease;
}
.icon-button:hover {
  background: rgba(240,165,160,0.16);
}
.publish-form {
  display: grid;
  gap: 18px;
  padding: 28px;
  padding-top: 22px;
}
.form-row {
  display: grid;
  gap: 10px;
}
.form-row label {
  font-weight: 700;
  color: var(--text-secondary);
}
.form-row input,
.form-row select,
.form-row textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 14px 16px;
  outline: none;
  background: #fff;
  color: var(--text-primary);
  transition: border-color 0.25s ease;
}
.form-row input:focus,
.form-row select:focus,
.form-row textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(240,165,160,0.12);
}
.auth-toggle {
  font-weight: 700;
  color: var(--text-secondary);
}
.auth-toggle input {
  margin-right: 10px;
}
.form-row textarea {
  resize: vertical;
}
.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 14px;
  flex-wrap: wrap;
}
@media (max-width: 960px) {
  .product-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
@media (max-width: 780px) {
  .hero-panel,
  .app-header {
    flex-direction: column;
    align-items: stretch;
  }
  .search-panel {
    min-width: auto;
  }
  .product-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 560px) {
  .page-shell {
    width: min(100%, calc(100% - 24px));
    padding: 18px 0 32px;
  }
  .product-grid {
    grid-template-columns: 1fr;
  }
  .app-header,
  .hero-panel {
    padding: 20px;
  }
  .page-shell {
    padding: 20px 0 30px;
  }
}
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="app-header">
      <div class="brand">
        <img src="/static/logo.jpg" alt="GDUFS交换站 logo" class="brand-mark" />
        <div>
          <h1>GDUFS交换站</h1>
          <p>为交换好物而生</p>
        </div>
      </div>
      <div class="app-actions">
        <a href="/my-products" class="secondary-button small">我的商品</a>
        <a href="/admin" id="adminLink" class="secondary-button small hidden">管理后台</a>
        <div class="user-panel hidden" id="userPanel">
          <span class="user-welcome">欢迎，<strong id="usernameDisplay"></strong></span>
          <button class="secondary-button small" id="logoutButton">退出</button>
        </div>
        <button class="secondary-button small" id="openLogin">登录 / 注册</button>
        <button class="primary-button" id="openPublish">发布商品</button>
      </div>
    </header>

    <section class="hero-panel">
      <div class="hero-copy">
        <p class="eyebrow">大学生专属二手交易</p>
        <h2>发现闲置好物，和同校同学更安心</h2>
        <p class="hero-text">海量商品分类浏览，支持快速搜索与发布。找到你的下一件学习用品、电子设备、生活好物。</p>
      </div>
      <div class="search-panel">
        <label for="searchInput" class="search-label">搜索商品</label>
        <div class="search-box">
          <input id="searchInput" type="search" placeholder="输入课程教材、数码、寝室用品等" />
          <button id="searchButton" aria-label="搜索">搜索</button>
        </div>
      </div>
    </section>

    <section class="product-summary">
      <div>
        <p class="summary-label">热卖推荐</p>
        <h3>当季热门商品</h3>
      </div>
      <p id="resultCount">共 0 件商品可浏览</p>
    </section>

    <section class="product-grid" id="productGrid"></section>

    <section class="tip-card">
      <h3>使用小技巧</h3>
      <div class="tip-list">
        <span>✓ 先搜索再发布，避免重复上架</span>
        <span>✓ 清晰图片和详细描述更容易成交</span>
        <span>✓ 直接与卖家联系，安全交易更顺畅</span>
      </div>
    </section>
  </div>

  <div class="modal-backdrop hidden" id="publishModal">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h2>发布新商品</h2>
          <p>填写后即可快速上架，等待校内买家查看。</p>
        </div>
        <button class="icon-button" id="closePublish" aria-label="关闭" title="关闭">×</button>
      </div>
      <form id="publishForm" class="publish-form">
        <div class="form-row">
          <label for="titleInput">商品名称</label>
          <input id="titleInput" type="text" placeholder="比如：标题笔记本、二手相机" required />
        </div>
        <div class="form-row">
          <label for="priceInput">价格（元）</label>
          <input id="priceInput" type="number" min="1" placeholder="如 120" required />
        </div>
        <div class="form-row">
          <label for="contactInput">联系方式</label>
          <input id="contactInput" type="text" placeholder="QQ / 微信 / 手机" required />
        </div>
        <div class="form-row">
          <label for="categoryInput">分类</label>
          <select id="categoryInput">
            <option value="教材">教材</option>
            <option value="电子产品">电子产品</option>
            <option value="生活用品">生活用品</option>
            <option value="服饰配件">服饰配件</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="form-row">
          <label for="imageInput">图片链接</label>
          <input id="imageInput" type="url" placeholder="https://example.com/image.jpg" />
        </div>
        <div class="form-row">
          <label for="imageFileInput">上传图片</label>
          <input id="imageFileInput" type="file" accept="image/*" />
        </div>
        <div class="form-row">
          <label for="descriptionInput">商品描述</label>
          <textarea id="descriptionInput" rows="4" placeholder="补充商品成色、购买时间、适用场景等"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="secondary-button" id="cancelPublish">取消</button>
          <button type="submit" class="primary-button">立即发布</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="loginModal">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h2>校园账号登录</h2>
          <p>登录后即可发布商品、标记售出并查看个人状态。</p>
        </div>
        <button class="icon-button" id="closeLogin" aria-label="关闭" title="关闭">×</button>
      </div>
      <form id="authForm" class="publish-form">
        <div class="form-row">
          <label for="authUsername">用户名</label>
          <input id="authUsername" type="text" placeholder="请输入用户名" required />
        </div>
        <div class="form-row">
          <label for="authPassword">密码</label>
          <input id="authPassword" type="password" placeholder="请输入密码" required />
        </div>
        <div class="form-row">
          <label class="auth-toggle">
            <input id="registerMode" type="checkbox" /> 新用户注册
          </label>
        </div>
        <div class="form-actions">
          <button type="button" class="secondary-button" id="cancelLogin">取消</button>
          <button type="submit" class="primary-button" id="authSubmit">登录</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
